name: Contract validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: genvm-lint check contracts/handover_iq.py
      - run: genvm-lint typecheck contracts/handover_iq.py
      - run: genvm-lint schema contracts/handover_iq.py --output /tmp/abi.json
      - run: diff -u docs/abi.json /tmp/abi.json
